# Self-contained: this stack owns its own Postgres (below) and Redis, so it no
# longer needs cobol-ingestor-api running. Host ports are chosen not to clash
# with that project (its Postgres is on 5432): Postgres 5433, Redis 6380. The
# service writes only to its own `voice_insights` schema (self-provisioned on
# first boot — see AuthStore, CustomerProfileStore, RecommendationStore).
# Redis is this service's own instance, not shared with cobalt-rag-api's.

services:

  # ── AIA Voice Insights API ───────────────────────────────────────────────────
  voice-insights-azureapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice_insights_azure_api
    ports:
      - "8084:8084"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_RESOURCE: ${AZURE_OPENAI_RESOURCE}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-4o-mini}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-large}
      AZURE_OPENAI_TRANSCRIBE_DEPLOYMENT: ${AZURE_OPENAI_TRANSCRIBE_DEPLOYMENT:-gpt-4o-transcribe}
      AZURE_OPENAI_TTS_DEPLOYMENT: ${AZURE_OPENAI_TTS_DEPLOYMENT:-}
      AZURE_OPENAI_TTS_ENDPOINT: ${AZURE_OPENAI_TTS_ENDPOINT:-}
      AZURE_OPENAI_TTS_API_KEY: ${AZURE_OPENAI_TTS_API_KEY:-}
      VOICE_DEBUG_AUDIO_DUMP_DIR: ${VOICE_DEBUG_AUDIO_DUMP_DIR:-}
      VOICE_DEBUG_DROP_AFTER_SEGMENT: ${VOICE_DEBUG_DROP_AFTER_SEGMENT:-0}
      VOICE_STT_HEDGE_MS: ${VOICE_STT_HEDGE_MS:-5000}   # a segment still unanswered after this long is also sent by plain upload
      JUNO_VOICE_FEMALE: ${JUNO_VOICE_FEMALE:-coral}
      JUNO_VOICE_MALE: ${JUNO_VOICE_MALE:-ash}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ingestor
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1g"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Postgres ──────────────────────────────────────────────────────────────────
  # Own instance (same image, database and credentials as cobol-ingestor-api's,
  # separate data volume). Host port 5433 for psql/IDE access; other containers
  # reach it as postgres:5432.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voice_insights_postgres
    environment:
      POSTGRES_DB: ingestor
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    networks:
      - default
    ports:
      - "5433:5432"
    volumes:
      - voice_insights_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ingestor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────────────────
  # Session cache-aside only (see AuthStore) — Postgres stays the source of
  # truth, so a lost volume just means a cold cache next boot.
  redis:
    image: redis:7-alpine
    container_name: voice_insights_azure_redis
    command: >
      redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - default
    ports:
      - "6380:6379"
    volumes:
      - azure_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  azure_redis_data:
  voice_insights_pg_data:
