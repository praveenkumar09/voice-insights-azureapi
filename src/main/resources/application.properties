server.port=8084
spring.application.name=voice-insights-azureapi

# ── Actuator / Prometheus ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# ── Azure OpenAI ───────────────────────────────────────────────────────────
# Endpoint like https://<resource>.openai.azure.com/ ; the model names below
# are Azure *deployment names* (create deployments with these names, or
# override via env vars).
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY}
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-4o-mini}
spring.ai.azure.openai.chat.options.temperature=0.2
spring.ai.azure.openai.embedding.options.deployment-name=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-3-large}
# Azure's embedding options have no 'dimensions' setting in Spring AI M6:
# the deployment's native size is used — text-embedding-3-large = 3072, which
# matches voice-insights-ingestor's embed dims and the
# voice_insights.product_chunks vector(3072) column both read/write.

# Realtime transcription — browser mic audio is relayed to the gpt-4o-transcribe
# deployment over a server-side websocket (see voice/AzureOpenAiRealtimeTranscriptionClient).
voice.azure.realtime.url=wss://${AZURE_OPENAI_RESOURCE}.openai.azure.com/openai/realtime?api-version=${AZURE_OPENAI_REALTIME_API_VERSION:2025-04-01-preview}&intent=transcription
voice.azure.realtime.transcription-model=${AZURE_OPENAI_TRANSCRIBE_DEPLOYMENT:gpt-4o-transcribe}
# Biases transcription vocabulary toward Singapore/Malaysia/China insurance
# conversations. gpt-4o-transcribe rejects the 'languages'/'keywords' session
# fields outright (confirmed live), so 'prompt' free text is the only accepted
# bias mechanism for this model.
voice.azure.realtime.prompt=Insurance conversation in Singapore. Expect Singlish, code-switching, Indian, Malay and Chinese names, and terms like \
  CPF, MediSave, critical illness, term life, premium, dependents.

# Names that commonly come up in Singapore advisor conversations, appended to the prompt above so the speech model
# spells them correctly instead of guessing (e.g. Rahim, not "Rohin"; Suresh, not "Surisha"). Add your customers'
# common names here, or override with VOICE_NAME_HINTS in the environment.
#
# HARD LIMIT: Azure rejects a transcription prompt longer than 1024 characters — and then transcribes NOTHING — so
# the prompt and this list together must stay under it (the server also trims to 1000). Put the names that are most
# often mis-spelled first, and prefer names with more than one plausible spelling over common ones like Tan or Lim.
voice.azure.realtime.name-hints=${VOICE_NAME_HINTS:\
  Pravin, Praveen, Prakash, Priya, Swetha, Neela, Raja, Rajesh, Ravi, Ramesh, Suresh, Kumar, Sundar, Arun, Anand, Vijay, Vikram, \
  Deepa, Divya, Kavitha, Lakshmi, Meena, Nisha, Anita, Sanjay, Siva, Karthik, Gopal, Naveen, Rohan, Ananya, Krishnan, Pillai, Nair, \
  Subramaniam, Muthu, Aisha, Siti, Nurul, Farah, Hafiz, Hakim, Iqbal, Hussain, Rahim, Rahman, Zulkifli, Wei Ming, Jia Hui, Xin Yi, \
  Hui Min, Mei Ling, Zhi Wei, Kai Wen, Jun Jie, Siew Lan, Boon Kiat, Chen, Chin, Wong, Teo, Goh, Koh, Chua, Yeo, Marcus, Ethan, \
  Chloe, Daniel, Kevin, Jason, Jessica, MediShield Life}

# ── PostgreSQL / pgvector — SAME server as cobol-ingestor-api / cobalt-rag-api,
#    own schema (see db.schema below and every *Store's self-provisioning DDL) ──
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ingestor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
voice.db.schema=voice_insights

# ── Redis (own instance — see this project's docker-compose.yml) ───────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.timeout=2000ms
voice.redis.session-cache-ttl-seconds=300

# ── Product retrieval (Need agent) ──────────────────────────────────────────
voice.product-search.top-k=8
voice.product-search.similarity-threshold=0.3

# ── Juno speech (Azure OpenAI gpt-4o-mini-tts) ───────────────────────────────────────────────────────────────────
# Same Azure OpenAI resource by default; set AZURE_OPENAI_TTS_ENDPOINT / AZURE_OPENAI_TTS_API_KEY if the speech model
# lives on a different resource. Empty deployment = speech disabled (the browser falls back to its own voice).
juno.tts.deployment=${AZURE_OPENAI_TTS_DEPLOYMENT:}
juno.tts.endpoint=${AZURE_OPENAI_TTS_ENDPOINT:${AZURE_OPENAI_ENDPOINT:}}
juno.tts.api-key=${AZURE_OPENAI_TTS_API_KEY:${AZURE_OPENAI_API_KEY:}}
juno.tts.api-version=${AZURE_OPENAI_TTS_API_VERSION:2025-03-01-preview}
juno.tts.voice.female=${JUNO_VOICE_FEMALE:coral}
juno.tts.voice.male=${JUNO_VOICE_MALE:ash}
